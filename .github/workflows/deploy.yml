name: Deploy Vercel

# Deploy automático de produção na Vercel a cada push na main.
# Só executa quando os secrets do repositório estiverem configurados:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# (Settings → Secrets and variables → Actions)
#
# IMPORTANTE: se você importar o repositório pela dashboard da Vercel
# (integração nativa GitHub ↔ Vercel), o deploy por push já acontece
# automaticamente e ESTE workflow se torna desnecessário — use um ou outro.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-secrets:
    name: Verificar secrets da Vercel
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          echo "ready=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::Secrets da Vercel não configurados — deploy pulado. Adicione VERCEL_TOKEN, VERCEL_ORG_ID e VERCEL_PROJECT_ID em Settings → Secrets and variables → Actions."
          fi

  deploy:
    name: Deploy para produção
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Vercel (produção)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
